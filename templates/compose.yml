# Three networks, so the proxy has no route to the backends:
#   edge:    xray <-> caddy
#   web:     caddy <-> seafile
#   backend: seafile <-> db, redis (internal: no route to the internet)
networks:
  edge:
  web:
  backend:
    internal: true

services:
  xray:
    image: ghcr.io/xtls/xray-core:latest
    restart: unless-stopped
    networks:
      - edge
    command: ["run", "-c", "/etc/xray/config.json"]
    ports:
      - "443:443"               # REALITY owns TCP 443
    volumes:
      - ./xray/server.json:/etc/xray/config.json:ro
    depends_on:
      - caddy
    mem_limit: 96m

  caddy:
    image: caddy:2
    restart: unless-stopped
    networks:
      - edge
      - web
    ports:
      - "80:80"                 # ACME HTTP-01 + redirect to https
    # 8443 is NOT published: only Xray reaches it, over the edge network
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
    environment:
      SEAFILE_HOSTNAME: ${SEAFILE_SERVER_HOSTNAME}
      ACME_EMAIL: ${ACME_EMAIL}
    mem_limit: 96m

  db:
    image: mariadb:10.11
    restart: unless-stopped
    networks:
      - backend
    command:
      - --innodb-buffer-pool-size=32M
      - --innodb-log-buffer-size=4M
      - --performance-schema=OFF
      - --max-connections=30
      - --table-open-cache=200
      - --key-buffer-size=4M
    environment:
      MYSQL_ROOT_PASSWORD: ${INIT_SEAFILE_MYSQL_ROOT_PASSWORD}
      MYSQL_LOG_CONSOLE: "true"
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 20s
      start_period: 30s
      retries: 10
    mem_limit: 192m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - backend
    command: ["redis-server", "--maxmemory", "32mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    mem_limit: 64m

  seafile:
    image: seafileltd/seafile-mc:13.0-latest
    restart: unless-stopped
    networks:
      - web
      - backend
    volumes:
      - ./data/seafile:/shared
    environment:
      SEAFILE_MYSQL_DB_HOST: db
      SEAFILE_MYSQL_DB_USER: seafile
      SEAFILE_MYSQL_DB_PASSWORD: ${SEAFILE_MYSQL_DB_PASSWORD}
      INIT_SEAFILE_MYSQL_ROOT_PASSWORD: ${INIT_SEAFILE_MYSQL_ROOT_PASSWORD}
      SEAFILE_MYSQL_DB_CCNET_DB_NAME: ccnet_db
      SEAFILE_MYSQL_DB_SEAFILE_DB_NAME: seafile_db
      SEAFILE_MYSQL_DB_SEAHUB_DB_NAME: seahub_db
      TIME_ZONE: UTC
      INIT_SEAFILE_ADMIN_EMAIL: ${INIT_SEAFILE_ADMIN_EMAIL}
      INIT_SEAFILE_ADMIN_PASSWORD: ${INIT_SEAFILE_ADMIN_PASSWORD}
      SEAFILE_SERVER_HOSTNAME: ${SEAFILE_SERVER_HOSTNAME}
      SEAFILE_SERVER_PROTOCOL: https
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      ENABLE_SEADOC: "false"
      CACHE_PROVIDER: redis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    mem_limit: 640m
